name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/windows-tauri-build.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_APP_ENV: desktop
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_DJANGO_URL: ${{ vars.NEXT_PUBLIC_DJANGO_URL }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Windows bundler tools
        shell: pwsh
        run: choco install nsis wixtoolset -y --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Show build configuration
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          Write-Host "NEXT_PUBLIC_APP_ENV=$env:NEXT_PUBLIC_APP_ENV"
          Write-Host "NEXT_PUBLIC_API_URL=$env:NEXT_PUBLIC_API_URL"

      - name: Build Windows installer
        run: npm run tauri:build:windows:x64

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: handy-pos-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.zip
